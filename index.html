<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5edf9" />
    <meta
      name="description"
      content="Deine kleine Einhorn-Zauberwelt: gestalten, pflegen, spielen und Sterne sammeln. Kostenlos und ohne Anmeldung."
    />
    <title>Einhorn-Zauberwelt</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext y='32' font-size='32'%3E✦%3C/text%3E%3C/svg%3E"
    />
    <style>
:root {
  --ink: #514665;
  --muted: #8a8096;
  --purple: #9272ad;
  --deep: #74558e;
  --pink: #e6b6ca;
  --cream: #faf8f4;
  --line: #e9e2ed;
  --green: #84a995;
  --shadow: 0 8px 30px #64507709;
  font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  color: var(--ink);
  background: var(--cream);
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
textarea {
  font: inherit;
}
button,
a,
input,
textarea {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: default;
  opacity: 0.5;
}
button {
  color: inherit;
}
button,
a {
  touch-action: manipulation;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 3px solid #9b7bb7;
  outline-offset: 4px;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  border: 0;
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
h1,
h2,
h3 {
  font-weight: 600;
  letter-spacing: -0.035em;
}
h1 {
  font-size: clamp(30px, 4vw, 46px);
  line-height: 1.12;
  margin-bottom: 12px;
}
h2 {
  font-size: 26px;
}
h3 {
  font-size: 18px;
}
p {
  line-height: 1.6;
}
.topbar {
  height: 94px;
  max-width: 1280px;
  margin: auto;
  padding: 0 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.brand {
  display: flex;
  gap: 11px;
  align-items: center;
  font-family: Georgia, serif;
  font-size: 27px;
  line-height: 1;
}
.brand-mark {
  color: #a78bbd;
  background: #eee6f2;
  border-radius: 15px;
  width: 43px;
  height: 46px;
  display: grid;
  place-items: center;
  font-size: 33px;
}
.brand-sub {
  font:
    9px "Trebuchet MS",
    sans-serif;
  letter-spacing: 4px;
  display: block;
  margin-top: 7px;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 20px;
}
.balance {
  background: #f7efda;
  border: 1px solid #eee1bf;
  border-radius: 30px;
  padding: 10px 18px;
  font-size: 15px;
}
.balance > span {
  color: #c49c47;
  font-size: 20px;
  margin-right: 7px;
}
.icon-button {
  display: flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  font-size: 20px;
  padding: 12px 5px;
}
.icon-button span {
  font-size: 12px;
}
.icon-button:hover {
  color: var(--purple);
}
#app {
  max-width: 1192px;
  margin: auto;
  padding: 18px 0 125px;
}
.eyebrow {
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 10px;
  font-weight: 700;
  color: var(--purple);
  margin-bottom: 12px;
}
.page-heading {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  margin-bottom: 27px;
}
.page-heading p {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 0;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  border-radius: 30px;
  padding: 9px 15px;
  background: #fff9;
  font-size: 11px;
  color: var(--muted);
}
.world-hero {
  position: relative;
  min-height: 434px;
  border: 6px solid #fff;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.landscape {
  position: absolute;
  width: 100%;
  height: 100%;
  inset: 0;
}
.world-copy {
  position: absolute;
  left: 35px;
  top: 30px;
  max-width: 290px;
}
.world-copy h2 {
  font-family: Georgia, serif;
  font-size: 32px;
  line-height: 1.2;
  margin: 9px 0;
  color: #61556f;
}
.world-copy p {
  font-size: 12px;
  color: #7b7283;
  max-width: 230px;
}
.world-copy .pill {
  background: #ffffffa6;
  border: 0;
  color: #8b739c;
}
.world-pony {
  position: absolute;
  width: 310px;
  bottom: 10px;
  left: 44%;
  transform: translateX(-50%);
  cursor: pointer;
}
.world-sign {
  position: absolute;
  right: 36px;
  bottom: 32px;
  background: #fffefaeb;
  border: 1px solid white;
  border-radius: 15px;
  padding: 16px 20px;
  box-shadow: 0 5px 15px #6b5a7920;
  max-width: 230px;
}
.world-sign p {
  font-size: 11px;
  color: var(--muted);
  margin: 5px 0 12px;
}
.world-sign strong {
  font-size: 15px;
  font-weight: 600;
}
.tiny-link {
  font-size: 11px;
  color: var(--deep);
  background: none;
  padding: 0;
}
.sparkle {
  position: absolute;
  color: #fff7d5;
  font-size: 25px;
  animation: twinkle 3s infinite alternate;
  pointer-events: none;
}
.sparkle.one {
  top: 47%;
  left: 48%;
}
.sparkle.two {
  top: 57%;
  left: 31%;
  font-size: 17px;
  animation-delay: -1s;
}
.butterfly {
  position: absolute;
  color: #c89ebf;
  font-size: 27px;
  left: 64%;
  top: 43%;
  animation: butterfly 7s infinite ease-in-out;
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 32px 0 17px;
}
.section-heading h2 {
  font-size: 19px;
  margin: 0;
}
.section-heading span {
  font-size: 11px;
  color: var(--muted);
}
.destinations {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.destination {
  display: flex;
  align-items: center;
  gap: 17px;
  padding: 21px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 19px;
  box-shadow: var(--shadow);
  transition:
    transform 0.2s,
    border-color 0.2s;
}
.destination:hover {
  transform: translateY(-4px);
  border-color: #c3acd5;
}
.destination .tile-icon {
  width: 60px;
  height: 64px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-size: 29px;
  background: var(--tint, #f0e7f5);
  color: var(--accent, #a383b7);
  flex-shrink: 0;
}
.destination h3 {
  font-size: 15px;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
}
.destination p {
  font-size: 11px;
  color: var(--muted);
  margin: 0;
}
.destination .arrow {
  margin-left: auto;
  color: #b5a4c3;
}
.world-footer {
  display: flex;
  gap: 12px;
  justify-content: center;
  font-size: 10px;
  color: var(--muted);
  margin-top: 25px;
  letter-spacing: 0.4px;
}
#navigation {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  border: 1px solid #e8dfed;
  background: #fffefbf5;
  backdrop-filter: blur(12px);
  padding: 9px 13px;
  border-radius: 22px;
  z-index: 20;
  box-shadow: 0 10px 35px #69527a15;
}
#navigation a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  font-size: 9px;
  min-width: 84px;
  padding: 9px 12px;
  border-radius: 14px;
  color: #95879e;
}
#navigation a > span {
  font-size: 22px;
  line-height: 1;
}
#navigation a.active {
  color: var(--deep);
  background: #eee6f4;
}
#navigation a:hover {
  background: #f6f1f8;
}
.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: start;
}
.panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 23px;
  padding: 26px;
  box-shadow: var(--shadow);
}
.panel h2 {
  font-size: 20px;
  margin-bottom: 8px;
}
.panel p.description {
  font-size: 12px;
  color: var(--muted);
}
.preview {
  position: relative;
  min-height: 420px;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 45%, #fff9f2, #eee5f4);
  border-radius: 23px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 6px solid #fff;
  box-shadow: var(--shadow);
}
.preview .pony {
  width: 85%;
  max-width: 420px;
}
.preview:before {
  content: "✧";
  position: absolute;
  font-size: 60px;
  color: #c6afd6;
  top: 10%;
  right: 12%;
  opacity: 0.5;
}
.preview:after {
  content: "✦";
  position: absolute;
  font-size: 24px;
  color: #d2b97d;
  bottom: 20%;
  left: 12%;
  opacity: 0.6;
  pointer-events: none;
}
.preview-label {
  position: absolute;
  bottom: 20px;
  left: 20px;
  right: 20px;
  text-align: center;
  font-size: 12px;
  color: #9a89a4;
}
.pony {
  width: 100%;
  overflow: visible;
}
.pony-body {
  animation: breathe 3s ease-in-out infinite;
  transform-origin: center bottom;
}
.tail {
  animation: tail 3.5s ease-in-out infinite;
}
.ear {
  animation: ear 6s infinite;
}
.eyes {
  animation: blink 5s infinite;
  transform-origin: 212px 101px;
}
.sleeping .eyes {
  animation: none;
}
.sleeping .pony-body {
  animation: breathe 5s infinite;
}
.sleeping {
  transform: translateY(18px) rotate(-6deg);
}
.pony.chew .mouth {
  animation: chew 0.2s 5;
  transform-origin: 250px 140px;
}
.pony.bounce .pony-body {
  animation: jump 0.55s ease-in-out;
}
.pony.wash {
  filter: drop-shadow(0 0 15px #b6e4f4);
}
.pony.brush .tail {
  animation: tail 0.25s 4;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.between {
  justify-content: space-between;
}
.control-group {
  margin: 21px 0;
}
.control-group:first-child {
  margin-top: 0;
}
.control-label {
  font-size: 12px;
  font-weight: 700;
  display: block;
  margin-bottom: 11px;
}
.swatches {
  display: flex;
  gap: 11px;
  flex-wrap: wrap;
}
.swatch {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  border: 3px solid white;
  box-shadow: 0 0 0 1px #e8dfea;
  position: relative;
}
.swatch[aria-pressed="true"] {
  box-shadow: 0 0 0 2px var(--purple);
}
.swatch[aria-pressed="true"]:after {
  content: "✓";
  color: #514665;
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.chip {
  padding: 10px 14px;
  background: #f6f2f8;
  border: 1px solid #ebe2ef;
  border-radius: 11px;
  font-size: 12px;
  min-height: 42px;
}
.chip[aria-pressed="true"] {
  background: #eae0f0;
  border-color: #b69bca;
  color: var(--deep);
}
.chip small {
  font-size: 10px;
  color: #a08444;
  display: block;
  margin-top: 3px;
}
.button {
  background: var(--purple);
  color: white;
  padding: 13px 23px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  box-shadow: 0 3px 0 #76548e20;
}
.button:hover {
  background: var(--deep);
}
.button.secondary {
  background: #f0e9f4;
  color: var(--deep);
  box-shadow: none;
}
.button.light {
  background: white;
  color: var(--deep);
}
.button.danger {
  background: #f7e7e9;
  color: #a36873;
}
.name-edit {
  display: flex;
  gap: 9px;
  margin-top: 16px;
}
.name-edit input {
  min-width: 0;
  flex: 1;
}
input,
textarea {
  border: 1px solid #dcd0e5;
  border-radius: 11px;
  background: #fffcff;
  padding: 12px;
  color: var(--ink);
  width: 100%;
}
input {
  font-size: 16px;
}
textarea {
  resize: vertical;
  min-height: 120px;
  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.muted {
  color: var(--muted);
  font-size: 12px;
}
.care-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 13px;
  margin-bottom: 22px;
}
.need {
  background: white;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 15px;
  font-size: 11px;
}
.need .row {
  justify-content: space-between;
  gap: 4px;
  margin-bottom: 10px;
}
.need b {
  font-size: 10px;
  color: var(--muted);
}
.track {
  height: 6px;
  background: #f1eaf2;
  border-radius: 9px;
  overflow: hidden;
}
.track > i {
  height: 100%;
  display: block;
  border-radius: 9px;
  background: var(--pink);
  transition: width 0.5s;
}
.care-message {
  background: #fbf5f8;
  padding: 13px;
  border-radius: 12px;
  font-size: 12px;
  text-align: center;
  min-height: 46px;
  margin-top: 14px;
}
.foods {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}
.food {
  width: calc(33.33% - 6px);
  border: 1px solid #eee3ed;
  background: #fffaf5;
  padding: 13px 6px 10px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 6px;
  font-size: 10px;
  touch-action: none;
  user-select: none;
  cursor: grab;
}
.food svg {
  width: 48px;
  height: 48px;
  pointer-events: none;
}
.food.dragging {
  opacity: 0.5;
}
.food-ghost {
  position: fixed;
  pointer-events: none;
  width: 65px;
  height: 65px;
  z-index: 100;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 5px 6px #70547744);
}
.drop-ready {
  outline: 3px dashed #b095c5;
  outline-offset: -13px;
}
.care-tools {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}
.care-tool {
  background: #eff3f0;
  border: 1px solid #e0e8e1;
  padding: 14px 8px;
  border-radius: 13px;
  font-size: 11px;
}
.care-tool span {
  display: block;
  font-size: 25px;
  margin-bottom: 8px;
  color: #85a18e;
}
.particles {
  position: absolute;
  inset: 0;
  pointer-events: none;  overflow: hidden;
}
.particle {
  position: absolute;
  left: 50%;
  top: 42%;
  font-size: 28px;
  color: #d8a1bd;
  animation: particle 1.2s ease-out forwards;
}
.room {
  background: linear-gradient(#efe5ee 0 66%, #d9c5b4 66%);
  height: 430px;
  border: 6px solid white;
  border-radius: 23px;
  position: relative;
  overflow: hidden;
}
.room:before {
  content: "";
  position: absolute;
  left: 29px;
  top: 32px;
  width: 100px;
  height: 120px;
  border-radius: 50px 50px 0 0;
  border: 8px solid #fffbf4;
  background:
    linear-gradient(90deg, transparent 46%, #fffbf4 46% 54%, transparent 54%),
    linear-gradient(transparent 46%, #fffbf4 46% 54%, transparent 54%), #c2dce6;
  box-shadow: 0 0 0 2px #d5c4ce;
}
.room-pony {
  position: absolute;
  width: 280px;
  bottom: 27px;
  left: 40%;
  transform: translateX(-50%);
}
.bed {
  position: absolute;
  background: #bca3cc;
  width: 230px;
  height: 65px;
  border-radius: 35px 35px 16px 16px;
  bottom: 38px;
  left: 35px;
  border: 8px solid #b093c2;
}
.bed:before {
  content: "";
  position: absolute;
  left: 7px;
  top: 0;
  width: 55px;
  height: 29px;
  background: #fff3e8;
  border-radius: 15px;
}
.furniture {
  position: absolute;
}
.furniture.rug {
  bottom: 15px;
  left: 15px;
  width: 300px;
  height: 50px;
  border-radius: 50%;
  background: repeating-radial-gradient(
    ellipse,
    #ead4b2 0 10px,
    #cfa6b8 12px 20px
  );
}
.furniture.plant {
  right: 20px;
  bottom: 65px;
  font-size: 60px;
  color: #81a48a;
}
.furniture.lamp {
  right: 50px;
  top: 20px;
  color: #d7b45f;
  font-size: 62px;
  text-shadow: 0 0 25px #f8e7a9;
}
.furniture.picture {
  right: 25px;
  top: 115px;
  border: 7px solid #fff5df;
  background: #d5e5e6;
  padding: 10px 16px;
  font-size: 35px;
  color: #c09dc1;
}
.shop {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 20px;
}
.shop .chip {
  text-align: left;
  min-height: 70px;
}
.shop .chip.owned {
  border-color: #a8c7b2;
  background: #edf5ef;
}
.game-shell {
  background: #fff;
  border: 1px solid var(--line);
  padding: 10px;
  border-radius: 25px;
  overflow: hidden;
}
.game-stage {
  height: 420px;
  position: relative;
  overflow: hidden;
  border-radius: 17px;
  background: #e6eff2;
  touch-action: none;
  outline-offset: -4px;
}
.game-stage .landscape {
  width: 150%;
  max-width: none;
  left: -20%;
}
.game-ground {
  position: absolute;
  height: 70px;
  bottom: 0;
  width: 100%;
  background: #bdd3b0;
  border-top: 8px solid #9fb995;
}
.game-player {
  position: absolute;
  width: 116px;
  height: 102px;
  left: 12%;
  bottom: 70px;
  z-index: 3;
  will-change: transform;
}
.game-player .pony {
  height: 100%;
  width: 100%;
}
.game-player .pony-body {
  animation: none;
}
.game-item {
  position: absolute;
  left: 0;
  bottom: 70px;
  will-change: transform;
  display: flex;
  align-items: center;
  justify-content: center;
}
.game-item.star {
  width: 32px;
  height: 32px;
  color: #bb933e;
  font-size: 32px;
  text-shadow: 0 2px #fff1bd;
}
.game-item.obstacle {
  width: 36px;
  height: 40px;
  border-radius: 40% 40% 8px 8px;
  background: #ba91bd;
  border: 3px solid #a680ab;
}
.game-item.obstacle:before {
  content: "";
  position: absolute;
  top: -12px;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: #e3bfdb;
  border: 2px solid #b08bb7;
}
.game-item.cloud {
  width: 65px;
  height: 43px;
  background: #a8b4cb;
  border-radius: 30px;
  box-shadow: 15px -9px #a8b4cb;
}
.game-item.charm {
  width: 30px;
  height: 30px;
  color: #8f70b1;
  font-size: 32px;
}
.game-overlay {
  position: absolute;
  inset: 0;
  background: #f5edf3de;
  backdrop-filter: blur(4px);
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
}
.game-overlay h2 {
  font-family: Georgia, serif;
  font-size: 32px;
  margin-bottom: 10px;
}
.game-overlay p {
  font-size: 13px;
  max-width: 360px;
}
.game-overlay .row {
  justify-content: center;
}
.game-hud {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 4;
  pointer-events: none;
}

    <script>
(() => {
const KEY = "einhorn-zauberwelt-v1";
const palette = [
  "#fff7ee",
  "#f6c6dc",
  "#cbb9ee",
  "#a7dce2",
  "#f5d38d",
  "#a9d6b4",
];
const hairColors = [
  "#b28ade",
  "#e892b9",
  "#66b9cf",
  "#e8b65c",
  "#87bf98",
  "rainbow",
];
const accessories = {
  none: { name: "Ohne", price: 0 },
  bow: { name: "Schleife", price: 0 },
  flower: { name: "Blume", price: 0 },
  crown: { name: "Sternenkrone", price: 20 },
  glasses: { name: "Sonnenbrille", price: 15 },
  necklace: { name: "Halskette", price: 12 },
  wings: { name: "Zauberflügel", price: 35 },
};
const furniture = {
  rug: { name: "Blumenteppich", price: 12 },
  plant: { name: "Zauberpflanze", price: 18 },
  lamp: { name: "Sternenlampe", price: 25 },
  picture: { name: "Regenbogenbild", price: 15 },
};
function fresh() {
  return {
    version: 1,
    name: "Sternchen",
    stars: 0,
    look: {
      coat: palette[0],
      mane: hairColors[0],
      tail: hairColors[0],
      style: "waves",
      pattern: "none",
      accessory: "bow",
    },
    owned: ["none", "bow", "flower", "waves", "short", "none-pattern", "spots"],
    needs: { hunger: 65, clean: 75, love: 70, rest: 80 },
    home: [],
    garden: [null, null, null],
    progress: { run: 0, flight: 0, memory: 0, harvests: 0 },
    sound: false,
    started: false,
  };
}
function validate(s) {
  const fail = () => {
    throw new Error(
      "Dieser Spielstand ist unvollständig oder beschädigt. Bitte kopiere den ganzen Code.",
    );
  };
  const num = (v, max = 100000000) =>
    Number.isSafeInteger(v) && v >= 0 && v <= max;
  if (
    !s ||
    s.version !== 1 ||
    typeof s.name !== "string" ||
    !s.name.trim() ||
    s.name.length > 24 ||
    !num(s.stars) ||
    typeof s.sound !== "boolean" ||
    typeof s.started !== "boolean"
  )
    fail();
  if (
    !s.look ||
    !palette.includes(s.look.coat) ||
    !hairColors.includes(s.look.mane) ||
    !hairColors.includes(s.look.tail) ||
    !["waves", "short", "braid"].includes(s.look.style) ||
    !["none", "spots", "sparkles"].includes(s.look.pattern) ||
    !Object.hasOwn(accessories, s.look.accessory)
  )
    fail();
  const items = [
    ...Object.keys(accessories),

function mountMemory(root, { state, save, reward }) {
  const symbols = Object.keys(animalNames);
  let cards = [],
    open = [],
    matched = 0,
    moves = 0,
    locked = false,
    timer = 0;
  function start() {
    clearTimeout(timer);
    cards = symbols.flatMap((s, i) => [
      { s, id: i },
      { s, id: i },
    ]);
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    open = [];
    matched = 0;
    moves = 0;
    locked = false;
    render();
  }
  function render() {
    root.innerHTML = `<div class="panel"><div class="row between"><div><h2>Das fröhliche Tier-Memory</h2><p class="muted">Finde die sechs Tierpaare: Pony, Katze, Hund und ihre Freunde. Es gibt kein Zeitlimit.</p></div><button class="button secondary" id="memory-new">Neu mischen</button></div><div class="memory-board">${cards.map((c, i) => `<button class="memory-card" data-card="${i}" aria-label="Verdeckte Karte ${i + 1}" aria-pressed="false">✧</button>`).join("")}</div><p class="memory-status" role="status">0 von 6 Paaren · 0 Züge</p></div>`;
    root.querySelector("#memory-new").onclick = start;
    root
      .querySelectorAll("[data-card]")
      .forEach((b) => (b.onclick = () => flip(+b.dataset.card, b)));
  }
  function flip(i, b) {
    if (locked || b.classList.contains("matched") || open.includes(i)) return;
    tone();
    b.innerHTML = animalPicture(cards[i].s);
    b.classList.add("revealed");
    b.setAttribute("aria-pressed", "true");
    b.setAttribute("aria-label", animalNames[cards[i].s]);
    open.push(i);
    if (open.length < 2) return;
    moves++;
    const [a, c] = open;
    if (cards[a].id === cards[c].id) {
      for (const n of open) {
        const el = root.querySelector(`[data-card="${n}"]`);
        el.classList.add("matched");
        el.setAttribute("aria-disabled", "true");
      }
      open = [];
      matched++;
      tone("star");
      if (matched === 6) {
        state.progress.memory++;
        save();
        reward(8);
        root.querySelector(".memory-status").textContent =
          `Alle Paare gefunden in ${moves} Zügen! +8 Sterne`;
        return;
      }
    } else {
      locked = true;
      timer = setTimeout(() => {
        for (const n of open) {
          const el = root.querySelector(`[data-card="${n}"]`);
          if (el) {
            el.textContent = "✧";
            el.classList.remove("revealed");
            el.setAttribute("aria-pressed", "false");
            el.setAttribute("aria-label", `Verdeckte Karte ${n + 1}`);
          }
        }
        open = [];
        locked = false;
      }, 900);
    }
    root.querySelector(".memory-status").textContent =
      `${matched} von 6 Paaren · ${moves} Züge`;
  }
  start();
  return () => clearTimeout(timer);
}

function saveDialog(tab = "save") {
  openDialog(
    `<h2 id="dialog-title">Dein Stückchen Zauber.</h2><p>Bewahre deine Welt auf und nimm sie auf ein anderes Gerät mit.</p><div class="save-tabs"><button class="chip" id="tab-save" aria-pressed="${tab === "save"}">Spielstand speichern</button><button class="chip" id="tab-load" aria-pressed="${tab === "load"}">Spielstand laden</button></div>${tab === "save" ? `<label class="control-label" for="save-code">Dein persönlicher Speichercode</label><textarea id="save-code" readonly spellcheck="false">${encode(state)}</textarea><div class="dialog-actions"><button class="button" id="copy-code">Code kopieren</button><button class="button secondary" id="download-code">Als Datei sichern</button></div><p class="dialog-note">Bewahre den Code außerhalb dieses Browsers auf. Er enthält deinen jetzigen Spielstand – auch nach dem Löschen der Browserdaten kannst du ihn laden. Nach neuen Fortschritten brauchst du einen neuen Code.</p>` : `<label class="control-label" for="load-code">Füge deinen Speichercode ein</label><textarea id="load-code" placeholder="EZ1.…" spellcheck="false" autocapitalize="off"></textarea><p class="dialog-error" id="code-error" role="alert"></p><button class="button" id="load-code-button">Spielstand wiederherstellen</button><p class="dialog-note">Dein bisheriger Spielstand wird erst nach deiner Bestätigung ersetzt.</p>`}<p class="dialog-note">Automatisch gespeichert wird zusätzlich auf diesem Gerät.</p><button class="tiny-link" id="new-game" style="margin-top:8px">Ein neues Abenteuer beginnen</button>`,
  );
  content.querySelector("#tab-save").onclick = () => saveDialog("save");
  content.querySelector("#tab-load").onclick = () => saveDialog("load");
  content.querySelector("#new-game").onclick = () =>
    confirmAction(
      "Ein neues Abenteuer?",
      "Dein bisheriger Spielstand wird ersetzt. Sichere vorher deinen Speichercode, wenn du ihn behalten möchtest.",
      "Neues Spiel",
      () => newGame(),
    );
  if (tab === "save") {
    content.querySelector("#copy-code").onclick = async () => {
      try {
        await navigator.clipboard.writeText(
          content.querySelector("#save-code").value,
        );
        toast("Dein Speichercode wurde kopiert. Bewahre ihn gut auf.");
      } catch {
        const t = content.querySelector("#save-code");
        t.focus();
        t.select();
        toast(
          "Bitte kopiere den markierten Code über das Kopiermenü deines Geräts.",
        );
      }
    };
    content.querySelector("#download-code").onclick = () => {
      const blob = new Blob([encode(state)], {
          type: "text/plain;charset=utf-8",
        }),
        url = URL.createObjectURL(blob),
        a = document.createElement("a");
      a.href = url;
      a.download = "einhorn-zauberwelt-spielstand.txt";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
  } else
    content.querySelector("#load-code-button").onclick = () => {
      try {
        const incoming = decode(content.querySelector("#load-code").value);
        confirmAction(
          "Diese Zauberwelt laden?",
          `Du lädst den Spielstand von ${esc(incoming.name)} mit ${incoming.stars} Sternen. Dein aktueller Spielstand wird ersetzt.`,
          "Spielstand laden",
          () => {
            cleanup();
            cleanup = () => {};
            state = incoming;
            state.started = true;
            sleeping = false;
            setAudio(state.sound);
            save();
            go("world");
            toast("Willkommen zurück! Deine Zauberwelt ist wieder da.");
          },
        );
      } catch (e) {
        content.querySelector("#code-error").textContent = e.message;
        tone("error");
      }
    };
}
function newGame() {
  openDialog(
    `<div class="dialog-star">✧</div><h2 id="dialog-title">Ein neuer Freund für dich.</h2><p>Wie soll dein Einhorn heißen? Du kannst den Namen später im Salon ändern.</p><form id="create-game"><label class="sr-only" for="first-name">Name deines Einhorns</label><input id="first-name" maxlength="24" placeholder="Zum Beispiel Sternchen" value="Sternchen" required autocomplete="off"><div class="dialog-actions"><button class="button" type="submit">Ab in die Zauberwelt →</button><button class="button secondary" id="cancel-new" type="button">Zurück</button></div></form>`,
  );
  content.querySelector("#cancel-new").onclick = () => welcome();
  content.querySelector("#create-game").onsubmit = (e) => {
    e.preventDefault();
    const name = content.querySelector("#first-name").value.trim();
    if (!name) {
      content
        .querySelector("#first-name")
        .setCustomValidity("Gib deinem Einhorn einen Namen.");
      content.querySelector("#first-name").reportValidity();
      return;
    }
    cleanup();
    cleanup = () => {};
    state = fresh();
    state.name = name;
    state.started = true;
    sleeping = false;
    setAudio(false);
    save();
    modal.close();
    go("world");
    toast(`Willkommen in deiner Zauberwelt, ${name}!`);
  };
  content.querySelector("#first-name").oninput = (e) =>
    e.target.setCustomValidity("");
}
function welcome() {
  openDialog(
    `<div class="eyebrow">EIN FREUND. EINE WELT VOLLER MAGIE.</div><div class="welcome-pony">${unicorn(state.look)}</div><h2 id="dialog-title">Deine Einhorn-Zauberwelt.</h2><p>Gestalte dein Einhorn, entdecke kleine Abenteuer und mach die Welt ein bisschen bunter.</p><div class="dialog-actions">${state.started ? '<button class="button" id="continue-game">Weiterspielen</button>' : ""}<button class="button ${state.started ? "secondary" : ""}" id="welcome-new">Neues Spiel</button><button class="button secondary" id="welcome-load">Spielstand laden</button></div><p class="dialog-note">Ohne Anmeldung. Ohne Werbung. Mit ganz viel Fantasie.</p>`,
    { closable: state.started },
  );
  content
    .querySelector("#continue-game")
    ?.addEventListener("click", () => modal.close());
  content.querySelector("#welcome-new").onclick = () => {
    if (state.started)
      confirmAction(
        "Neu anfangen?",
        "Sichere vorher deinen Speichercode. Dein bisheriger Fortschritt wird beim Start ersetzt.",
        "Weiter",
        newGame,
      );
    else newGame();
  };
  content.querySelector("#welcome-load").onclick = () => saveDialog("load");
}
function render() {
  cleanup();
  cleanup = () => {};
  page = location.hash.slice(1) || "world";
  if (page === "save") {
    saveDialog();
    page = "world";
    history.replaceState(null, "", "#world");
  }
  document.querySelectorAll("#navigation a").forEach((a) => {
    a.classList.toggle(
      "active",
      a.dataset.page === page ||
        (a.dataset.page === "games" &&
          ["flight", "memory", "garden"].includes(page)),
    );
    if (a.classList.contains("active")) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  const renders = {
    world,
    salon,
    care,
    home,
    games,
    garden,
    run: () => {
      app.innerHTML =
        heading(
          "HÜPFEN. STAUNEN. STERNE SAMMELN.",
          "Ein Pfad voller Abenteuer.",
          "Dein Einhorn nimmt seinen ganz eigenen Zauber mit.",
        ) + '<div id="runner"></div>';
      cleanup = mountRunner(app.querySelector("#runner"), {
        state,
        save,
        reward,
      });
    },
    flight: () => {
      app.innerHTML =
        '<a class="back-link" href="#games">← Alle Minispiele</a>' +
        heading(
          "DEM HIMMEL EIN STÜCKCHEN NÄHER",
          "Über den Wolken.",
          "Ein sanfter Flug durch deine Fantasiewelt.",
        ) +
        '<div id="runner"></div>';
      cleanup = mountRunner(app.querySelector("#runner"), {
        state,
        save,
        reward,
        flight: true,
      });
    },
    memory: () => {
      app.innerHTML =
        '<a class="back-link" href="#games">← Alle Minispiele</a>' +
        heading(
          "EIN PAAR MAGISCHE MOMENTE",
          "Was gehört zusammen?",
          "Lass dir Zeit. Hinter jeder Karte wartet ein kleiner Zauber.",
        ) +
        '<div id="memory"></div>';
      cleanup = mountMemory(app.querySelector("#memory"), {
        state,
        save,
        reward,
      });
    },
  };
  (renders[page] || world)();
  window.scrollTo({ top: 0, behavior: "instant" });
}
function go(to) {
  if (location.hash === "#" + to) render();
  else location.hash = to;
}
window.addEventListener("hashchange", render);
document.querySelector("#save-menu").onclick = () => saveDialog();
document.querySelector("#sound").onclick = () => {
  state.sound = !state.sound;
  if (!setAudio(state.sound)) {
    state.sound = false;
    toast("Ton ist in diesem Browser gerade nicht verfügbar.");
  }
  save();
  if (state.sound) tone("happy");
};
// AudioContext is activated only by a real user gesture, including after restoration.
document.addEventListener(
  "pointerdown",
  () => {
    if (state.sound) setAudio(true);
  },
  { passive: true },
);
modal.addEventListener("cancel", (e) => {
  if (!state.started) e.preventDefault();
});
window.addEventListener("pagehide", () => save());
setInterval(() => {
  if (state.sound && !document.hidden) ambience(performance.now());
}, 1000);
save();
render();
welcome();

})();
</script>
  </body>
</html>
